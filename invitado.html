<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación al Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #fdf2f8; }
        .invitation-container { max-width: 500px; margin: 40px auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container invitation-container">
    
    <div id="vista-invitacion" class="card border-0 shadow-lg p-4 text-center" style="border-radius: 15px;">
        <div class="mb-4 text-primary-custom">
            <i class="bi bi-envelope-paper-heart" style="font-size: 3rem;"></i>
        </div>
        
        <h2 id="inv-display-titulo" class="fw-bold mb-3" style="color: #ec4899;">Cargando...</h2>
        <p id="inv-display-mensaje" class="text-secondary mb-4"></p>
        
        <div class="bg-light p-3 rounded-3 mb-4 text-start shadow-sm border">
            <p class="mb-2"><i class="bi bi-calendar-event me-2 text-primary-custom"></i> <strong id="inv-display-evento">...</strong></p>
            <p class="mb-2"><i class="bi bi-clock me-2 text-primary-custom"></i> <span id="inv-display-fecha"></span> a las <span id="inv-display-hora"></span></p>
            <p class="mb-2"><i class="bi bi-geo-alt me-2 text-primary-custom"></i> <span id="inv-display-lugar"></span></p>
            <p class="mb-0 mt-2 pt-2 border-top"><i class="bi bi-person-badge me-2 text-primary-custom"></i> <strong>Vestimenta:</strong> <span id="inv-display-vestimenta">Cargando...</span></p>
        </div>

        <button id="btn-abrir-registro" class="btn btn-primary-custom w-100 py-2 fs-5 fw-bold shadow-sm">Confirmar Asistencia</button>
    </div>

    <div id="vista-formulario" class="card border-0 shadow-lg p-4 hidden" style="border-radius: 15px;">
        <h4 class="fw-bold text-center mb-1 text-dark">Tu Registro</h4>
        <p class="text-center text-muted small mb-4">Por favor llena tus datos para esperarte.</p>

        <form id="registro-invitados">
            <div class="card p-3 mb-4 bg-light border-0 shadow-sm">
                <h6 class="fw-bold text-primary-custom border-bottom pb-2 mb-3">Tus Datos Principales</h6>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Nombre Completo</label>
                    <input type="text" id="nombre-principal" class="form-control" placeholder="Ej. Juan Pérez" required>
                </div>
                <div class="mb-2">
                    <label class="form-label small fw-semibold">¿Qué menú prefieres?</label>
                    <select id="menu-principal" class="form-select select-menus-dinamicos" required>
                        <option value="">Cargando menús...</option>
                    </select>
                </div>
            </div>

            <div id="acompanantes-container"></div>

            <button type="button" id="btn-agregar-acompanante" class="btn btn-outline-secondary w-100 mb-4 border-dashed">
                <i class="bi bi-person-plus me-2"></i>Añadir un acompañante
            </button>

            <div class="d-grid gap-2">
                <button type="submit" id="btn-enviar-registro" class="btn btn-primary-custom py-2 fw-bold">Enviar Confirmación</button>
                <button type="button" id="btn-cancelar-registro" class="btn btn-light text-muted">Cancelar</button>
            </div>
        </form>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/script.js"></script>
</body>
</html>
