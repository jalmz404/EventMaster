<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EventMaster — Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="guest-form-container w-100" style="max-width: 500px;">

    <!-- Logo / Marca -->
    <div class="text-center mb-4">
      <div class="icon-box mx-auto">
        <i class="fa-solid fa-heart"></i>
      </div>

      <span class="badge badge-hero px-3 py-2 mb-3">
        EventMaster
      </span>

      <h1 class="fw-bold text-primary-custom mb-2">
        Crear cuenta
      </h1>

      <p class="text-muted mb-0">
        Regístrate para organizar tus eventos
      </p>
    </div>

    <!-- Formulario -->
    <form id="formRegistro" novalidate>

      <div class="mb-4">
        <label for="correo" class="form-label fw-semibold">
          Correo electrónico
        </label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0">
            <i class="fa-regular fa-envelope text-primary-custom"></i>
          </span>
          <input 
            type="email"
            id="correo"
            name="correo"
            class="form-control border-start-0 py-2"
            placeholder="tu@correo.com"
            autocomplete="email"
          />
        </div>
        <p class="field-hint text-danger small mt-1 mb-0" id="hint-correo"></p>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">
          Contraseña
        </label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0">
            <i class="fa-solid fa-lock text-primary-custom"></i>
          </span>
          <input 
            type="password"
            id="password"
            name="password"
            class="form-control border-start-0 py-2"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
          />
        </div>
        <div class="mt-3">
          <div class="progress" style="height: 8px;">
            <div 
              class="progress-bar bg-primary-custom"
              id="strengthFill"
              role="progressbar"
              style="width: 0%"
            ></div>
          </div>

          <div class="d-flex justify-content-end mt-1">
            <small class="text-muted" id="strengthLabel"></small>
          </div>
        </div>

        <p class="field-hint text-danger small mt-1 mb-0" id="hint-password"></p>
      </div>
      <div class="mb-4">
        <label for="confirmar" class="form-label fw-semibold">
          Confirmar contraseña
        </label>

        <div class="input-group">
          <span class="input-group-text bg-white border-end-0">
            <i class="fa-solid fa-shield-heart text-primary-custom"></i>
          </span>

          <input 
            type="password"
            id="confirmar"
            name="confirmar"
            class="form-control border-start-0 py-2"
            placeholder="Repite tu contraseña"
            autocomplete="new-password"
          />
        </div>
        <p class="field-hint text-danger small mt-1 mb-0" id="hint-confirmar"></p>
      </div>
      <div class="d-grid mb-4">
        <button type="submit" class="btn btn-primary-custom py-3 fw-semibold" id="btnSubmit">
          <span class="btn-text">
            <i class="fa-solid fa-user-plus me-2"></i>Registrarse</span>
          <span class="spinner-border spinner-border-sm ms-2 d-none spinner"></span>
        </button>
      </div>
      <div class="alert alert-danger d-none" id="alertMsg"></div>
    </form>

    <div class="text-center">
      <p class="text-muted mb-0">¿Ya tienes cuenta?
        <a href="login.html" class="text-primary-custom fw-semibold text-decoration-none">
          Iniciar sesión
        </a>
      </p>
    </div>

  </div>

  <script src="js/registro.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
