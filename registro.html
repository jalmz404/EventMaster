<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventMaster | Registro de Organizador</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-bg">

    <div class="auth-card">
        
        <div class="pink-dot"></div>
        
        <h3>Registro de Organizador</h3>

        <form id="form-registro-organizador">
    
          <div class="form-group mb-3">
              <label for="reg-correo">Correo electrónico</label>
              <input type="email" class="form-control" id="reg-correo" placeholder="admin@eventos.com" required>
          </div>

          <div class="form-group mb-4">
              <label for="reg-password">Contraseña</label>
              <input type="password" class="form-control" id="reg-password" placeholder="Crea una contraseña segura" required>
          </div>

          <button type="submit" class="btn btn-primary-custom w-100 p-2">Crear Cuenta</button>

          <a href="login.html" class="footer-link">¿Ya tienes cuenta? Inicia sesión aquí</a>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="js/script.js"></script>

</body>
</html>
