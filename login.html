<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventMaster | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-5 shadow-sm border-0 bg-white" style="max-width: 400px; border-radius: 16px;">
            <div class="text-center mb-4">
                <div class="d-inline-block bg-primary-custom text-white rounded-circle p-3 mb-3">
                    <i class="bi bi-calendar2-star fs-2"></i>
                </div>
                <h4 class="fw-bold text-dark">Panel Administrativo</h4>
            </div>
            
            <form id="form-login" novalidate>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Correo organizador</label>
                    <input type="email" id="correo-login" class="form-control shadow-none" placeholder="admin@eventos.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Contraseña</label>
                    <input type="password" id="password-login" class="form-control shadow-none" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-2 fw-semibold text-center d-block">
                    Ingresar al Sistema
                </button>

                <div id="mensaje-error" class="text-danger text-center small fw-bold" style="min-height: 20px;"></div>
            </form>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
